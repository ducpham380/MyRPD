name: GAME SERVER

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Thời gian chạy (phút)'
        type: choice
        default: '340'
        options: ['60', '180', '340']

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  GAME_PORT: '1024'   # TODO: đổi sang port TCP của game

jobs:
  game:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Setup RDP + user
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0
          netsh advfirewall firewall add rule name="RDP-TS" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 profile=any | Out-Null
          netsh advfirewall firewall add rule name="Game-TS" dir=in action=allow protocol=TCP localport=$env:GAME_PORT remoteip=100.64.0.0/10 profile=any | Out-Null
          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          # Chỉ chữ + số (bỏ ký tự dễ nhầm), double-click là chọn được cả chuỗi
          $set = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'
          do {
            $pw = -join (1..16 | ForEach-Object { $set[[Security.Cryptography.RandomNumberGenerator]::GetInt32($set.Length)] })
          } until ($pw -cmatch '[A-Z]' -and $pw -cmatch '[a-z]' -and $pw -match '\d')

          net user pmd "$pw" /add /y | Out-Null
          net localgroup Administrators pmd /add | Out-Null
          net localgroup "Remote Desktop Users" pmd /add | Out-Null
          "RDP_PASSWORD=$pw" >> $env:GITHUB_ENV

      - name: Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE }}
        run: |
          if (-not $env:TS_KEY) { throw "Missing TAILSCALE_AUTH_KEY" }
          $msi = "$env:TEMP\ts.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          for ($i = 0; $i -lt 10; $i++) {
            & $ts up --authkey="$env:TS_KEY" --hostname="gh-game" --reset 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep 3
          }
          if ($LASTEXITCODE -ne 0) { throw "Tailscale up failed" }

          $ip = $null
          for ($i = 0; $i -lt 20 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep 2 }
          }
          if (-not $ip) { throw "No Tailscale IP" }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Start game server
        run: |
          # TODO: thay bằng lệnh chạy server game của bạn (phải bind 0.0.0.0:$env:GAME_PORT)
          # Ví dụ:
          # Start-Process -FilePath "java" -ArgumentList "-jar server.jar nogui" -WorkingDirectory "$PWD"
          Write-Host "Chưa cấu hình lệnh chạy server game."

      - name: Show info + keep alive
        run: |
          Write-Host ""
          Write-Host "===== RDP ====="
          Write-Host "Address:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host "Username:"
          Write-Host "pmd"
          Write-Host "Password:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host "===== GAME ====="
          Write-Host "$env:TAILSCALE_IP`:$env:GAME_PORT"
          Write-Host ""

          # Job Summary: mỗi giá trị một khối code, bấm nút copy là xong
          $f = '```'
          @(
            '## RDP', '', 'Address', $f, $env:TAILSCALE_IP, $f,
            'Username', $f, 'pmd', $f,
            'Password', $f, $env:RDP_PASSWORD, $f,
            '## Game', $f, "$($env:TAILSCALE_IP):$($env:GAME_PORT)", $f
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

          $end = (Get-Date).AddMinutes([int]'${{ inputs.duration }}')
          $idleLimit = 30
          $lastActive = Get-Date

          while ((Get-Date) -lt $end) {
            if ((Get-Service TermService).Status -ne 'Running') { Start-Service TermService }

            $n = @(Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue |
              Where-Object { $_.LocalPort -in 3389, [int]$env:GAME_PORT }).Count
            if ($n -gt 0) { $lastActive = Get-Date }

            if (((Get-Date) - $lastActive).TotalMinutes -ge $idleLimit) {
              Write-Host "Idle $idleLimit phút, kết thúc."; break
            }
            Write-Host ("[{0:HH:mm}] Kết nối: {1} | Còn: {2:N0} phút" -f (Get-Date), $n, ($end - (Get-Date)).TotalMinutes)
            Start-Sleep 300
          }

      - name: Cleanup
        if: always()
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout 2>$null
