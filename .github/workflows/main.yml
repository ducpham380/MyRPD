name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Bật Remote Desktop (giữ NLA mặc định để an toàn hơn)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force

          # Xóa rule cũ cùng tên để tránh trùng
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null

          # Chỉ cho phép RDP từ dải IP của Tailscale
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 `
            remoteip=100.64.0.0/10 profile=any | Out-Null

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Write-Host "RDP configured."

      - name: Create RDP User with Secure Password
        run: |
          # Chỉ chữ + số (bỏ ký tự dễ nhầm) để copy/dán dễ
          $set = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'
          do {
            $password = -join (1..16 | ForEach-Object {
              $set[[Security.Cryptography.RandomNumberGenerator]::GetInt32($set.Length)]
            })
          } until ($password -cmatch '[A-Z]' -and $password -cmatch '[a-z]' -and $password -match '\d')

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue | Remove-LocalUser -ErrorAction SilentlyContinue

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "User RDP created."

      - name: Install Tailscale
        run: |
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
              Write-Error "Tailscale installation failed."
              exit 1
          }
          Write-Host "Tailscale installed."

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing."
              exit 1
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Thử kết nối tối đa 10 lần (dịch vụ có thể chưa sẵn sàng ngay)
          for ($i = 1; $i -le 10; $i++) {
              & $ts up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="gh-runner-$env:GITHUB_RUN_ID" --reset 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "Tailscale up failed, retry $i/10..."
              Start-Sleep -Seconds 3
          }
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          # Chờ Tailscale cấp IP
          $tsIP = $null
          for ($i = 1; $i -le 20 -and -not $tsIP; $i++) {
              $ip = & $ts ip -4 2>$null | Select-Object -First 1
              if ($ip -match '^\d{1,3}(\.\d{1,3}){3}$') { $tsIP = $ip.Trim() }
              else { Write-Host "Waiting for Tailscale IP... $i/20"; Start-Sleep -Seconds 3 }
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        run: |
          $service = Get-Service -Name TermService -ErrorAction SilentlyContinue
          if (-not $service -or $service.Status -ne "Running") {
              Start-Service -Name TermService
              Start-Sleep -Seconds 3
          }

          # Test qua localhost cho chắc (máy tự kết nối tới IP Tailscale của chính nó có thể fail oan)
          $testResult = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not listening."
              exit 1
          }
          Write-Host "RDP is ready."

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "Port: 3389"
          Write-Host "==================`n"

          # Job Summary: mỗi giá trị một khối code để bấm copy
          $f = '```'
          @(
            '## RDP', '',
            'Address', $f, $env:TAILSCALE_IP, $f,
            'Username', $f, 'RDP', $f,
            'Password', $f, $env:RDP_PASSWORD, $f,
            'Port', $f, '3389', $f
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

          # Giữ phiên 345 phút (dưới giới hạn 355 phút của job, chừa thời gian cài đặt)
          $end = (Get-Date).AddMinutes(345)

          while ((Get-Date) -lt $end) {
              if ((Get-Service TermService).Status -ne 'Running') {
                  Start-Service TermService -ErrorAction SilentlyContinue
              }

              $n = @(Get-NetTCPConnection -LocalPort 3389 -State Established -ErrorAction SilentlyContinue).Count
              $left = [math]::Round(($end - (Get-Date)).TotalMinutes)
              Write-Host ("[{0:HH:mm:ss}] RDP Active | Connections: {1} | Remaining: {2} min" -f (Get-Date), $n, $left)

              Start-Sleep -Seconds 300
          }

          Write-Host "`n=== RDP TIME EXPIRED ===`n"

      - name: Cleanup
        if: always()
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout 2>$null
          Write-Host "Cleanup complete."
